[tool.poetry]
name = "kurs2"
version = "0.1.0"
description = ""
authors = ["Kysnez4 <kysnez4@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
poetry-core = "^2.2.1"
requests = "^2.32.5"
psycopg2-binary = "^2.9.11"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^7.0.0"
flake8 = "^7.3.0"
pytest = "^8.4.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

